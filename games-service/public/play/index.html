<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` and no user scaling: this is a drag-driven game on a grid sized to the
      viewport, so a pinch-zoom mid-drag moves the board under the finger. Zoom is a genuine
      accessibility control, which is why the grid scales itself to the available space instead -
      a larger phone gets larger cells rather than a scrollable board.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!--
      The launch token appears once, in this document's own URL. `no-referrer` stops it travelling
      in a `Referer` header from anything this page fetches or links to; every request after the
      first sends it in a request body instead.
    -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Circuit</title>
    <link rel="stylesheet" href="/play/app.css" />
  </head>
  <body>
    <!--
      Every screen ships in the document and is toggled with `hidden`, rather than being built in
      JavaScript. A timed game must not wait for a second round trip to show its board, and the
      one thing this page must never do is make the player's clock pay for our loading.

      WHAT IS MARKUP HERE AND WHAT IS NOT. The shells, the artwork and the layout are markup. Every
      word a player reads about a title - its name, its rules, how it scores - is filled in from
      the round state, because the page used to hold its own copy of the rules and the two had
      already drifted from the catalogue's. See `src/games/instructions.ts`.
    -->
    <main id="app">
      <section id="screen-loading" class="screen">
        <div class="spinner" aria-hidden="true"></div>
        <p class="muted">Loading your round...</p>
      </section>

      <section id="screen-intro" class="screen scroll" hidden>
        <!--
          The rules, drawn. A player who has never seen a flow puzzle does not learn it from three
          sentences, and this is a paid contest, so the seconds spent working out the interaction
          come out of their score. The path animates itself along the route a finger would take.

          Inline rather than an image file: it is the only way to have artwork that costs no extra
          request, needs no entry in the asset allowlist, and inherits the palette. The animation
          is switched off under `prefers-reduced-motion` in the stylesheet.
        -->
        <svg
          class="diagram"
          viewBox="0 0 180 100"
          role="img"
          aria-label="A path drawn between two terminals numbered one, filling every square"
        >
          <g class="diagram-grid">
            <rect x="10" y="10" width="38" height="38" rx="6" />
            <rect x="52" y="10" width="38" height="38" rx="6" />
            <rect x="94" y="10" width="38" height="38" rx="6" />
            <rect x="10" y="52" width="38" height="38" rx="6" />
            <rect x="52" y="52" width="38" height="38" rx="6" />
            <rect x="94" y="52" width="38" height="38" rx="6" />
          </g>
          <polyline
            class="diagram-trace"
            points="29,29 71,29 113,29 113,71 71,71 29,71"
            fill="none"
          />
          <g class="diagram-terminals">
            <circle cx="29" cy="29" r="13" />
            <text x="29" y="29">1</text>
            <circle cx="29" cy="71" r="13" />
            <text x="29" y="71">1</text>
          </g>
        </svg>

        <h1 id="intro-title">Circuit</h1>
        <p id="intro-limit" class="lead"></p>

        <div class="panels">
          <section class="panel">
            <h2 class="panel-title">How to play</h2>
            <ul id="intro-rules" class="rules"></ul>
          </section>

          <!-- Hidden by the script when a title reports no scoring summary, rather than rendering
               an empty heading. -->
          <section class="panel" id="intro-scoring-panel">
            <h2 class="panel-title">How you score</h2>
            <p id="intro-scoring" class="panel-body"></p>
          </section>
        </div>

        <button id="start" class="primary large" type="button">Start</button>
        <p id="intro-note" class="muted small"></p>
      </section>

      <section id="screen-play" class="screen play" hidden>
        <header class="bar">
          <span id="progress" class="progress"></span>
          <span id="clock" class="clock" aria-live="off"></span>
          <button id="leave" class="ghost small-btn" type="button">Leave</button>
        </header>

        <div id="board-wrap" class="board-wrap">
          <!-- `touch-action: none` lives in the stylesheet: a drag must not scroll the page. -->
          <svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Puzzle grid">
          </svg>
        </div>

        <footer class="bar footer">
          <p id="hint" class="hint" aria-live="polite"></p>
          <div class="actions">
            <button id="clear" class="ghost" type="button">Clear</button>
            <button id="submit" class="primary" type="button" disabled>Submit</button>
          </div>
        </footer>
      </section>

      <section id="screen-result" class="screen scroll" hidden>
        <!--
          Two pieces of artwork, one shown at a time, chosen by `resultCopy().triumphant`. A round
          that ran its clock out having solved nothing gets the neutral one: a trophy over an empty
          result reads as sarcasm.
        -->
        <div class="result-art" aria-hidden="true">
          <svg class="art art-win" viewBox="0 0 120 120">
            <circle class="art-halo" cx="60" cy="60" r="52" />
            <polyline class="art-trace" points="30,60 50,80 90,40" fill="none" />
          </svg>
          <svg class="art art-neutral" viewBox="0 0 120 120">
            <circle class="art-halo" cx="60" cy="60" r="52" />
            <line class="art-trace" x1="38" y1="60" x2="82" y2="60" />
          </svg>
        </div>

        <h1 id="result-title">Round ended</h1>

        <div class="stat">
          <span id="result-stat" class="stat-value">0</span>
          <span id="result-stat-label" class="stat-label">boards finished</span>
        </div>

        <p id="result-next" class="lead"></p>
        <button id="done" class="primary large" type="button">Back to contest</button>
      </section>

      <section id="screen-error" class="screen" hidden>
        <h1>Something went wrong</h1>
        <p id="error-detail" class="lead"></p>
        <button id="retry" class="ghost" type="button">Try again</button>
      </section>
    </main>

    <!--
      A CLASSIC SCRIPT IN FRONT OF THE MODULE, AND WHY IT IS NOT BELT-AND-BRACES.

      Everything below this comment is one module graph: `app.js` imports `board.js` and
      `presentation.js`. If any single file in that graph fails to arrive, the browser abandons
      the WHOLE graph - the importer does not evaluate either - so not one line of the game runs.
      There is then nothing on the screen but the loading section above, nothing in any server
      log, and no message to the platform, which sits behind its own opaque overlay waiting for a
      `ready` that can never come. That is exactly what a player reported on 8 September 2026,
      and the reason it was diagnosed from a browser console rather than from the product is that
      the product had no way to say it.

      This script is a classic one and it is deliberately the only script on the page that is:
      a classic script cannot be taken down by a module that 404s, so it is still running in the
      one situation the module graph is not. It watches for a boot that never happens, names the
      file if the browser told us which one, and - the load-bearing part - sends `ready` so the
      platform drops its overlay and the player can actually read the message and leave.

      IT MUST FIRE BEFORE THE PLATFORM'S OWN TIMEOUT (`READY_TIMEOUT_MS`, 12s in
      `components/games/ProviderGameFrame.tsx`). The platform's panel is the honest fallback for
      a frame that never even loaded its document; this one can say more, because it is inside
      the document. If this deadline were the longer of the two, the player would get the vaguer
      message and this would be dead code that still looked correct.
    -->
    <script>
      (function () {
        var BOOT_DEADLINE_MS = 8000;

        /*
         * WHY THE FAILING FILE IS FOUND IN THE RESOURCE TIMELINE AND NOT ON THE ERROR EVENT.
         *
         * Verified in a browser on 8 September 2026, with `presentation.js` deliberately 404ing:
         * the `error` event fires on the `<script>` element that STARTED the graph, so its
         * `src` is `app.js` - a file that loaded perfectly. Naming it told the player, and
         * anybody they reported it to, to go and look at the wrong file. A nested module has no
         * element of its own, so there is nothing else on the event to read.
         *
         * `performance.getEntriesByType("resource")` records the nested request, and Chromium
         * exposes `responseStatus` on it, so the actual 404 can be named exactly. Safari does not
         * implement `responseStatus`, which is why an unnamed message is a supported outcome
         * rather than a bug - and why the error listener stays: it still tells us a resource
         * failed, which picks the wording, even where the status is unavailable.
         *
         * The listener must be in the CAPTURE phase. Resource errors do not bubble, so a listener
         * on `window` without the `true` never sees them at all.
         */
        var resourceFailed = false;
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target !== window && (target.src || target.href)) {
              resourceFailed = true;
            }
          },
          true,
        );

        function failedResourceName() {
          if (!window.performance || !window.performance.getEntriesByType) return "";
          var entries = window.performance.getEntriesByType("resource");
          for (var i = entries.length - 1; i >= 0; i -= 1) {
            if (typeof entries[i].responseStatus === "number" && entries[i].responseStatus >= 400) {
              return String(entries[i].name).split("?")[0].split("/").pop();
            }
          }
          return "";
        }

        window.setTimeout(function () {
          // Set at the top of `app.js`, so it means "the code arrived and began running" rather
          // than "the game is playable". A round that is merely slow to fetch is the platform's
          // 12-second panel to report, not ours.
          if (window.__circuitLoaded) return;

          var name = failedResourceName();

          var detail = document.getElementById("error-detail");
          if (detail) {
            detail.textContent =
              (name
                ? "The game could not load one of its files (" + name + ")."
                : resourceFailed
                  ? "The game could not load one of its files."
                  : "The game's code did not finish loading.") +
              " Your attempt is already open, so reloading does not cost another one. If it" +
              " keeps failing, leave the round and its result will be resolved for you.";
          }

          var screens = document.querySelectorAll(".screen");
          for (var i = 0; i < screens.length; i += 1) screens[i].hidden = true;
          var error = document.getElementById("screen-error");
          if (error) error.hidden = false;

          // The retry button's real handler lives in `app.js`, which by definition never ran, so
          // it would be a control that does nothing. Reloading is the correct action here anyway:
          // a live round resumes rather than starting a second one.
          var retry = document.getElementById("retry");
          if (retry) {
            retry.onclick = function () {
              window.location.reload();
            };
          }

          /*
           * `"*"` as the target origin, matching `tellPlatform` in `app.js`. This message carries
           * no secret - it is the single word `ready` - and the platform verifies the SOURCE
           * window and the origin at its end, which is the check that matters.
           */
          try {
            window.parent.postMessage({ type: "ready" }, "*");
          } catch (ignored) {
            /* No parent, or a parent we may not talk to. The panel above is still on screen. */
          }
        }, BOOT_DEADLINE_MS);
      })();
    </script>
    <script type="module" src="/play/app.js"></script>
  </body>
</html>

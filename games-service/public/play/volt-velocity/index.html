<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>Volt Velocity</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050b14;
        color: #d8e6f5;
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #race {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      #status {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 24px;
        background: #050b14;
      }
      #status[hidden] {
        display: none;
      }
      #status strong {
        color: #00d5ff;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      /* Reason (6 Oct 2026, owner): a bar under the load copy so waiting does not look stuck. */
      #loadbar {
        width: min(280px, 70vw);
        height: 4px;
        margin-top: 4px;
        border-radius: 999px;
        background: rgba(0, 213, 255, 0.15);
        overflow: hidden;
      }
      #loadbar[hidden] {
        display: none;
      }
      #loadbar > i {
        display: block;
        height: 100%;
        width: 38%;
        border-radius: inherit;
        background: linear-gradient(90deg, #00d5ff, #7af0c8);
        animation: vv-load 1.1s ease-in-out infinite;
      }
      @keyframes vv-load {
        0% {
          transform: translateX(-130%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loadbar > i {
          width: 100%;
          animation: none;
          opacity: 0.65;
        }
      }
      #error {
        color: #ff8a8a;
        max-width: 32rem;
      }
    </style>
  </head>
  <body>
    <!-- The race client is a separate same-origin document; this page only boots it. -->
    <iframe
      id="race"
      title="Volt Velocity"
      allow="fullscreen; autoplay; gamepad"
      hidden
    ></iframe>
    <div id="status" role="status" aria-live="polite">
      <strong>Volt Velocity</strong>
      <span id="message">Loading the race&hellip;</span>
      <div id="loadbar" aria-hidden="true"><i></i></div>
      <span id="error"></span>
    </div>
    <script src="/play/volt-velocity/velocity-host.js?v=20261006d"></script>
  </body>
</html>

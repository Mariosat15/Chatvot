# ============================================
# CHARTVOLT NGINX CONFIGURATION
# ============================================
# 
# This configuration routes traffic to six services:
# - User App (port 3000) - DOMAIN_PLACEHOLDER
# - Admin App (port 3001) - ADMIN_DOMAIN_PLACEHOLDER
# - API Server (port 4000) - handles auth/bcrypt operations
# - WebSocket Server (port 3003) - handles real-time messaging
# - ChartVolt Games (port 4010) - GAMES_DOMAIN_PLACEHOLDER, the player's game iframe
# - (Worker has no HTTP port, runs in background)
#
# SETUP (for white-label):
# The setup-new-customer.sh script automatically replaces DOMAIN_PLACEHOLDER
# and ADMIN_DOMAIN_PLACEHOLDER with your actual domains. If doing it manually:
#   sed -i 's/DOMAIN_PLACEHOLDER/yourdomain.com/g' /etc/nginx/sites-available/chartvolt
#   sed -i 's/ADMIN_DOMAIN_PLACEHOLDER/admin.yourdomain.com/g' /etc/nginx/sites-available/chartvolt
#   sed -i 's/GAMES_DOMAIN_PLACEHOLDER/games.yourdomain.com/g' /etc/nginx/sites-available/chartvolt
#
# INSTALLATION:
# 1. First, add rate limiting to /etc/nginx/nginx.conf in the http {} block:
#    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=1r/s;
#    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
#    limit_req_status 429;
#
# 2. Copy this file to /etc/nginx/sites-available/chartvolt
# 3. Create symlink: ln -s /etc/nginx/sites-available/chartvolt /etc/nginx/sites-enabled/
# 4. Remove default: rm /etc/nginx/sites-enabled/default
# 5. Test: nginx -t
# 6. Reload: systemctl reload nginx
#
# SSL SETUP (after DNS is configured):
# sudo certbot --nginx -d DOMAIN_PLACEHOLDER -d www.DOMAIN_PLACEHOLDER -d ADMIN_DOMAIN_PLACEHOLDER -d GAMES_DOMAIN_PLACEHOLDER
#
# The games subdomain is not optional if you run provider games: the player's browser loads
# the board from it in an iframe on an https page, so a plain-http game origin is blocked as
# mixed content and the frame stays blank with nothing in any server log.

# ============================================
# UPSTREAM SERVERS
# ============================================

upstream user_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream admin_app {
    server 127.0.0.1:3001;
    keepalive 64;
}

upstream api_server {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream websocket_server {
    server 127.0.0.1:3003;
    keepalive 32;
}

upstream games_service {
    server 127.0.0.1:4010;
    keepalive 32;
}

# ============================================
# USER APP (Main Website)
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/app-access.log;
    error_log /var/log/nginx/app-error.log;

    # Increase body size for file uploads
    client_max_body_size 10M;

    # ============================================
    # API SERVER ROUTES (bcrypt/auth operations)
    # Route CPU-intensive auth operations to API server
    # ============================================
    
    location /api/auth/sign-up {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
    }

    location /api/auth/sign-in {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
    }

    # API health check
    location /api/health {
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ============================================
    # WEBSOCKET SERVER (Real-time Messaging)
    # ============================================
    location /ws {
        proxy_pass http://websocket_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeout settings (24 hours)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # WebSocket health check
    location /ws-health {
        proxy_pass http://websocket_server/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # WebSocket stats (internal)
    location /ws-stats {
        proxy_pass http://websocket_server/stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Restrict to internal/admin access
        allow 127.0.0.1;
        deny all;
    }

    # Root location - proxy to Next.js
    location / {
        proxy_pass http://user_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Next.js static files
    location /_next/static {
        proxy_pass http://user_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public assets
    location /assets {
        proxy_pass http://user_app;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Favicon
    location /favicon.ico {
        proxy_pass http://user_app;
        proxy_cache_valid 200 7d;
    }

    # Health check endpoint (main app)
    location /health {
        proxy_pass http://user_app;
        access_log off;
    }
}

# ============================================
# ADMIN APP (Separate Subdomain)
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name ADMIN_DOMAIN_PLACEHOLDER;

    # Extra security for admin
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Logging
    access_log /var/log/nginx/admin-access.log;
    error_log /var/log/nginx/admin-error.log;

    # Increase body size for file uploads (cosmetics, documents, etc.)
    client_max_body_size 10M;

    # Rate limiting for login
    location /login {
        limit_req zone=admin_limit burst=5 nodelay;
        proxy_pass http://admin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limiting for API auth
    location /api/auth {
        limit_req zone=admin_limit burst=5 nodelay;
        proxy_pass http://admin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # WEBSOCKET SERVER (Real-time Messaging for Admin)
    # ============================================
    location /ws {
        proxy_pass http://websocket_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeout settings (24 hours)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # AI routes need longer timeout (OpenAI calls can take 30-120s)
    location /api/ai/ {
        proxy_pass http://admin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180;
        proxy_send_timeout 180;
        proxy_connect_timeout 30;
    }

    # Badge evaluation trigger also needs longer timeout
    location /api/trigger-badge-evaluation {
        proxy_pass http://admin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180;
        proxy_send_timeout 180;
    }

    # Root - proxy to admin app
    location / {
        proxy_pass http://admin_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120;
    }

    # Next.js static files
    location /_next/static {
        proxy_pass http://admin_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ============================================
# CHARTVOLT GAMES (First-party Game Provider)
# ============================================
#
# This block is NOT like the two above, and the differences are the point rather than
# oversights. Read them before copying anything from the user or admin blocks into it.
#
# 1. NO `X-Frame-Options`. The play page exists to be embedded in an iframe on the main site,
#    so `SAMEORIGIN` - correct for the other two - would blank the game for every player.
#    Framing is restricted instead by `frame-ancestors` in the service's own
#    Content-Security-Policy, set from GAMES_FRAME_ANCESTORS in games-service/.env. That is a
#    real restriction, not a relaxation: only the platform's origin may frame it. It is set
#    there rather than here so one variable governs it, and because `X-Frame-Options` beside a
#    `frame-ancestors` directive is a well-known way to have one browser honour the wrong rule.
#
# 2. NO `add_header` for caching or security beyond nosniff. The service sets its own
#    `Referrer-Policy: no-referrer` and `Cache-Control` per route, and an `add_header` here
#    would REPLACE the whole inherited set rather than add to it - which is how the
#    no-referrer policy would quietly disappear and start leaking launch tokens in referrers.
#
# 3. The platform does NOT reach the API through this block. It calls the provider over
#    loopback at http://127.0.0.1:4010, so provider API traffic never leaves the machine.
#    This subdomain exists for the PLAYER's browser, which is why the spec treats the play
#    origin as a separate fact from the API base URL. Everything except /play and /health is
#    therefore refused here - see the final location block.
#
# SETUP:
#   sed -i 's/GAMES_DOMAIN_PLACEHOLDER/games.yourdomain.com/g' /etc/nginx/sites-available/chartvolt
#   sudo certbot --nginx -d GAMES_DOMAIN_PLACEHOLDER

server {
    listen 80;
    listen [::]:80;
    server_name GAMES_DOMAIN_PLACEHOLDER;

    # The only header safe to add here. See note 2 above before adding another.
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/games-access.log;
    error_log /var/log/nginx/games-error.log;

    # The play surface is a few kilobytes of HTML, CSS and JS and posts small JSON moves.
    # Nothing here uploads a file.
    client_max_body_size 256k;

    # ============================================
    # THE PLAY SURFACE (the player's iframe)
    # ============================================
    # Covers the document at /play, its three assets, and the /play/api/* calls the board
    # makes to fetch its state and submit a solution.
    location /play {
        proxy_pass http://games_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    # Catalogue artwork. Deterministic SVGs with a long cache, referenced by the games list.
    location /assets {
        proxy_pass http://games_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30;
    }

    location /health {
        proxy_pass http://games_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Certificate issuance and RENEWAL. This must sit above the catch-all below, and `^~` is
    # required rather than stylistic: it makes this prefix win outright, where a plain `location`
    # would lose to the `/` match and hand Let's Encrypt a 404.
    #
    # Reason it is here at all: certbot's nginx plugin normally inserts this itself, so issuance
    # would probably have worked and RENEWAL is the part that bites - it runs unattended from a
    # timer 60 days later, fails against the catch-all, and the first symptom is an expired
    # certificate blanking every player's game frame as mixed content.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ============================================
    # EVERYTHING ELSE IS REFUSED
    # ============================================
    # Reason: `/v1/*` is the provider API, reached over loopback by the platform and by nobody
    # else. Publishing it would put the round-creation and result endpoints on the internet for
    # no reason - they are authenticated, but an endpoint nobody needs to reach is one that
    # cannot be attacked. The sandbox controls, which can force a score, live under the same
    # prefix; they are disabled by configuration, and this makes them unreachable as well.
    #
    # 404 rather than 403: a refusal that confirms the path exists is an inventory.
    location / {
        return 404;
    }
}

# ============================================
# RATE LIMITING CONFIGURATION
# ============================================
# ADD THIS TO /etc/nginx/nginx.conf in the http {} block:
